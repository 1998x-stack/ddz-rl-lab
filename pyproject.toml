[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddz-rl-lab"
version = "0.5.0"
description = "Reproducible three-seat Dou Dizhu reinforcement learning laboratory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DDZ RL Lab Contributors"}]
dependencies = ["loguru>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6"]
rl = ["numpy>=1.24", "gymnasium>=1.0,<2", "pettingzoo>=1.24,<2"]
train = ["torch>=2.2,<3"]

[project.scripts]
ddz-demo = "ddz_core.cli:main"
ddz-env-demo = "ddz_env.baselines:main"
ddz-train = "ddz_training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
