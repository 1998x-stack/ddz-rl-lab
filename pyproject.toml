[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddz-rl-lab"
version = "0.1.0"
description = "Deterministic, no-stakes Dou Dizhu game core for multi-agent RL research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "DDZ RL Lab Contributors"}]
dependencies = ["loguru>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6"]

[project.scripts]
ddz-demo = "ddz_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
