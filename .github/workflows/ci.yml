name: Unit Tests
on:
  push:
  pull_request:

jobs:
  game-core-env:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,rl]'
      - run: python -m pytest -q
      - run: ddz-demo --games 3 --seed 2026 --replay-out /tmp/demo.json
      - run: ddz-env-demo --episodes 3 --seed 2026 --replay-out /tmp/env-demo.json
  torch-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,rl,web,webtest]'
      - run: OMP_NUM_THREADS=1 python -m pytest -q
      - name: Self-play/checkpoint/evaluation smoke
        run: >-
          OMP_NUM_THREADS=1 ddz-train train --episodes 2
          --batch-episodes 1 --eval-every 2 --eval-games 2
          --hidden 32 --output /tmp/ddz-training-ci
      - name: Inference bundle evaluation
        run: >-
          OMP_NUM_THREADS=1 ddz-train evaluate --checkpoint /tmp/ddz-training-ci/best.weights.pt
          --eval-games 2 --seed 34001

      - name: Multi-worker v5 training and tournament smoke
        run: |
          OMP_NUM_THREADS=1 ddz-train train --episodes 2 --batch-episodes 2 --eval-every 2 --eval-games 1 --hidden 16 --actor-workers 2 --output /tmp/ddz-v5-ci
          OMP_NUM_THREADS=1 ddz-train tournament --checkpoint /tmp/ddz-v5-ci/best.weights.pt --eval-games 2 --seed 35001

      - name: v6 seeded selection and registry smoke
        run: |
          OMP_NUM_THREADS=1 ddz-league evaluate \
            --incumbent baseline=/tmp/ddz-v5-ci/best.weights.pt \
            --candidate challenger=/tmp/ddz-v5-ci/history/step-000000002.weights.pt \
            --seed-start 70001 --deals-per-seed 2 --min-deals 30 --draws 100 \
            --report /tmp/ddz-v6-evidence.json
          OMP_NUM_THREADS=1 ddz-league --registry-dir /tmp/ddz-v6-registry register \
            --model-id baseline --checkpoint /tmp/ddz-v5-ci/best.weights.pt \
            --trusted-source-dir /tmp/ddz-v5-ci
          OMP_NUM_THREADS=1 ddz-league --registry-dir /tmp/ddz-v6-registry bootstrap --model-id baseline
          OMP_NUM_THREADS=1 ddz-league --registry-dir /tmp/ddz-v6-registry verify --model-id baseline

      - name: v7 spectator Arena HTTP + registered model smoke
        run: |
          OMP_NUM_THREADS=1 python -m pytest tests/test_v7_arena.py -q
          OMP_NUM_THREADS=1 python - <<'PYWEB'
          from ddz_web.api import create_app
          from fastapi.testclient import TestClient
          app = create_app('/tmp/ddz-v6-registry', '/tmp/ddz-v7-replays')
          with TestClient(app) as c:
              assert c.get('/api/health').json()['status'] == 'ok'
              assert 'baseline' in c.get('/api/models').json()['models']
              game = c.post('/api/games', json={'model_ids': ['baseline'] * 3})
              assert game.status_code == 201, game.text
              game_id = game.json()['game_id']
              assert c.post(f'/api/games/{game_id}/control', json={'action':'step'}).status_code == 200
          PYWEB

      - name: v8 dashboard read-only routes, integrity and wheel smoke
        run: |
          OMP_NUM_THREADS=1 python -m pytest tests/test_v8_lab.py -q
          node --check src/ddz_web/static/app.js
          node --check src/ddz_web/static/lab.js
          python -m pip wheel . --no-deps -w /tmp/ddz-wheel
          python - <<'PYWHEEL'
          from pathlib import Path
          import zipfile
          w=next(Path('/tmp/ddz-wheel').glob('ddz_rl_lab-*.whl'))
          with zipfile.ZipFile(w) as z:
              for asset in ('ddz_web/static/index.html','ddz_web/static/style.css',
                            'ddz_web/static/app.js','ddz_web/static/lab.js'):
                  assert asset in z.namelist(), asset
          PYWHEEL
