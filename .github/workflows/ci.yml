name: Unit Tests
on:
  push:
  pull_request:

jobs:
  game-core-env:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,rl]'
      - run: python -m pytest -q
      - run: ddz-demo --games 3 --seed 2026 --replay-out /tmp/demo.json
      - run: ddz-env-demo --episodes 3 --seed 2026 --replay-out /tmp/env-demo.json
  torch-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,rl,web,webtest]'
      - run: OMP_NUM_THREADS=1 python -m pytest -q
      - name: Self-play/checkpoint/evaluation smoke
        run: >-
          OMP_NUM_THREADS=1 ddz-train train --episodes 2
          --batch-episodes 1 --eval-every 2 --eval-games 2
          --hidden 32 --output /tmp/ddz-training-ci
      - name: Inference bundle evaluation
        run: >-
          OMP_NUM_THREADS=1 ddz-train evaluate --checkpoint /tmp/ddz-training-ci/best.weights.pt
          --eval-games 2 --seed 34001

      - name: Multi-worker v5 training and tournament smoke
        run: |
          OMP_NUM_THREADS=1 ddz-train train --episodes 2 --batch-episodes 2 --eval-every 2 --eval-games 1 --hidden 16 --actor-workers 2 --output /tmp/ddz-v5-ci
          OMP_NUM_THREADS=1 ddz-train tournament --checkpoint /tmp/ddz-v5-ci/best.weights.pt --eval-games 2 --seed 35001

      - name: v6 seeded selection and registry smoke
        run: |
          OMP_NUM_THREADS=1 ddz-league evaluate \
            --incumbent baseline=/tmp/ddz-v5-ci/best.weights.pt \
            --candidate challenger=/tmp/ddz-v5-ci/history/step-000000002.weights.pt \
            --seed-start 70001 --deals-per-seed 2 --min-deals 30 --draws 100 \
            --report /tmp/ddz-v6-evidence.json
          OMP_NUM_THREADS=1 ddz-league --registry-dir /tmp/ddz-v6-registry register \
            --model-id baseline --checkpoint /tmp/ddz-v5-ci/best.weights.pt \
            --trusted-source-dir /tmp/ddz-v5-ci
          OMP_NUM_THREADS=1 ddz-league --registry-dir /tmp/ddz-v6-registry bootstrap --model-id baseline
          OMP_NUM_THREADS=1 ddz-league --registry-dir /tmp/ddz-v6-registry verify --model-id baseline

      - name: v7 spectator Arena HTTP + registered model smoke
        run: |
          OMP_NUM_THREADS=1 python -m pytest tests/test_v7_arena.py -q
          OMP_NUM_THREADS=1 python - <<'PYWEB'
          from ddz_web.api import create_app
          from fastapi.testclient import TestClient
          app = create_app('/tmp/ddz-v6-registry', '/tmp/ddz-v7-replays')
          with TestClient(app) as c:
              assert c.get('/api/health').json()['status'] == 'ok'
              assert 'baseline' in c.get('/api/models').json()['models']
              game = c.post('/api/games', json={'model_ids': ['baseline'] * 3})
              assert game.status_code == 201, game.text
              game_id = game.json()['game_id']
              assert c.post(f'/api/games/{game_id}/control', json={'action':'step'}).status_code == 200
          PYWEB

      - name: v8 dashboard read-only routes, integrity and wheel smoke
        run: |
          OMP_NUM_THREADS=1 python -m pytest tests/test_v8_lab.py -q
          node --check src/ddz_web/static/app.js
          node --check src/ddz_web/static/lab.js
          python -m pip wheel . --no-deps -w /tmp/ddz-wheel
          python - <<'PYWHEEL'
          from pathlib import Path
          import zipfile
          w=next(Path('/tmp/ddz-wheel').glob('ddz_rl_lab-*.whl'))
          with zipfile.ZipFile(w) as z:
              for asset in ('ddz_web/static/index.html','ddz_web/static/style.css',
                            'ddz_web/static/app.js','ddz_web/static/lab.js'):
                  assert asset in z.namelist(), asset
          PYWHEEL

      - name: v9 foreground experiments, role crossplay and operator login
        run: |
          OMP_NUM_THREADS=1 python -m pytest tests/test_v9_features.py -q
          node --check src/ddz_web/static/auth.js
          OMP_NUM_THREADS=1 ddz-experiment run --spec examples/v9_smoke.json --runs-dir /tmp/ddz-v9-runs
          OMP_NUM_THREADS=1 ddz-experiment status ci-v9 --runs-dir /tmp/ddz-v9-runs
          OMP_NUM_THREADS=1 ddz-crossplay --registry-dir /tmp/ddz-v6-registry --lineup smoke:baseline,baseline,baseline --deals 2 --seed 2026 --report /tmp/ddz-v9-crossplay.json
          python - <<'PYV9'
          from pathlib import Path
          import json
          cp=json.loads(Path('/tmp/ddz-v9-crossplay.json').read_text())
          assert cp['schema']=='ddz-crossplay-v1'
          assert cp['lineups']['smoke']['deals']==2
          PYV9

      - name: v10 durable Arena, subprocess queue and role matrix smoke
        run: |
          OMP_NUM_THREADS=1 python -m pytest tests/test_v10_features.py -q
          node --check src/ddz_web/static/lab.js
          OMP_NUM_THREADS=1 ddz-jobs --runs-dir /tmp/ddz-v10-runs --jobs-dir /tmp/ddz-v10-jobs submit --spec examples/v9_smoke.json
          OMP_NUM_THREADS=1 ddz-jobs --runs-dir /tmp/ddz-v10-runs --jobs-dir /tmp/ddz-v10-jobs work --parallel 1 --once
          OMP_NUM_THREADS=1 ddz-crossplay-matrix --registry-dir /tmp/ddz-v6-registry --landlords baseline --farmer-ups baseline --farmer-downs baseline --deals 2 --seed 2919 --draws 100 --report /tmp/ddz-v10-matrix.json
          python - <<'PYV10'
          from pathlib import Path
          import json
          from ddz_experiments.jobs import JobQueue
          records = JobQueue('/tmp/ddz-v10-jobs','/tmp/ddz-v10-runs').list()
          assert len(records)==1 and records[0]['status']=='succeeded'
          matrix = json.loads(Path('/tmp/ddz-v10-matrix.json').read_text())
          assert matrix['schema']=='ddz-crossplay-matrix-v1' and len(matrix['rows'])==1
          PYV10

      - name: v11 migration, recovery, limits and matrix guardrails
        run: |
          OMP_NUM_THREADS=1 python -m pytest tests/test_v11_reliability.py -q
          OMP_NUM_THREADS=1 ddz-jobs --runs-dir /tmp/ddz-v11-runs --jobs-dir /tmp/ddz-v11-jobs submit --spec examples/v9_smoke.json --cpu-threads 2 --timeout-seconds 180
          OMP_NUM_THREADS=1 ddz-jobs --runs-dir /tmp/ddz-v11-runs --jobs-dir /tmp/ddz-v11-jobs work --parallel 1 --once
          python - <<'PYV11'
          from ddz_experiments.jobs import JobQueue
          q = JobQueue('/tmp/ddz-v11-jobs','/tmp/ddz-v11-runs')
          result = q.list()
          assert len(result)==1 and result[0]['status']=='succeeded'
          assert result[0]['cpu_threads']==2 and result[0]['timeout_seconds']==180
          PYV11

      - name: v12 training quality audit, retention and farmer interaction smoke
        run: |
          OMP_NUM_THREADS=1 python -m pytest tests/test_v12_quality.py -q
          OMP_NUM_THREADS=1 ddz-quality analyze --run /tmp/ddz-v9-runs/ci-v9 --draws 100 --report /tmp/ddz-v12-quality.json
          OMP_NUM_THREADS=1 ddz-quality retention --run /tmp/ddz-v5-ci --keep-recent 1 --keep-best 1
          OMP_NUM_THREADS=1 ddz-quality cooperation --registry-dir /tmp/ddz-v6-registry \
            --landlord baseline --up-base baseline --up-candidate baseline \
            --down-base baseline --down-candidate baseline --deals 2 --draws 100 \
            --report /tmp/ddz-v12-cooperation.json
          python - <<'PYV12'
          import json
          from pathlib import Path
          a = json.loads(Path('/tmp/ddz-v12-quality.json').read_text())
          b = json.loads(Path('/tmp/ddz-v12-cooperation.json').read_text())
          assert a['schema'] == 'ddz-training-quality-v1'
          assert a['summary']['bootstrap_ci95'] is None  # a single run is not independent-seed evidence
          assert b['schema'] == 'ddz-farmer-interaction-v1'
          assert not b['eligible']  # two deals are insufficient for statistical claims
          PYV12
